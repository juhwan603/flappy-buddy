<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날아라 버디 - Flappy Buddy</title>
    <style>
        :root {
            --sky: #87CEEB;
            --mint: #48D1CC;
            --mint-dark: #20B2AA;
            --yellow: #FFD700;
            --cream: #FFF8DC;
            --shadow: rgba(0, 0, 0, 0.2);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: var(--sky);
            box-shadow: 0 10px 25px var(--shadow);
            overflow: hidden;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            padding: 20px;
            transition: opacity 0.3s;
        }
        .ui-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: var(--yellow);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1rem;
            margin: 5px 0 20px 0;
            line-height: 1.5;
        }
        .btn {
            background-color: var(--mint);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:hover {
            background-color: var(--mint-dark);
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="score-board">0</div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="ui-layer">
        <h1>날아라 버디</h1>
        <p>스페이스바 또는 화면을 터치하여<br>노란 새를 위로 날려보세요.<br>민트색 장애물을 피해 통과하세요!</p>
        <button class="btn" id="start-btn">게임 시작</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameover-screen" class="ui-layer hidden">
        <h1>게임 종료</h1>
        <p>최종 점수: <span id="final-score">0</span>점</p>
        <button class="btn" id="restart-btn">다시 시작</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('gameover-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const scoreBoard = document.getElementById('score-board');
    const finalScore = document.getElementById('final-score');

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    
    // 새 객체 (초보자도 쉽도록 천천히 낙하하고 점프력이 부드럽도록 설정)
    let bird = {
        x: 80,
        y: 250,
        radius: 15,
        gravity: 0.35,
        lift: -6.5,
        velocity: 0
    };

    // 장애물 배열
    let pipes = [];
    let pipeWidth = 60;
    let pipeGap = 160; // 초보자를 위해 넉넉한 간격
    let pipeInterval = 120; // 프레임 단위 생성 주기
    let frameCount = 0;
    let pipeSpeed = 2.5; // 천천히 움직이는 속도

    function resetGame() {
        bird.y = 250;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        frameCount = 0;
        scoreBoard.innerText = score;
    }

    function startGame() {
        resetGame();
        gameState = 'PLAYING';
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        finalScore.innerText = score;
        gameOverScreen.classList.remove('hidden');
    }

    // 조작 이벤트 (스페이스바 또는 화면 터치/클릭)
    function jump() {
        if (gameState === 'PLAYING') {
            bird.velocity = bird.lift;
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            jump();
        }
    });

    canvas.addEventListener('click', () => {
        jump();
    });

    startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    restartBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        startGame();
    });

    // 게임 루프 그리기 및 물리 연산
    function update() {
        if (gameState === 'PLAYING') {
            // 새 물리 연산
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // 바닥 및 천장 충돌 검사
            if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
                triggerGameOver();
            }

            // 장애물 생성
            frameCount++;
            if (frameCount % pipeInterval === 0) {
                let minHeight = 50;
                let maxHeight = canvas.height - pipeGap - 100;
                let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: canvas.height - topHeight - pipeGap,
                    passed: false
                });
            }

            // 장애물 이동 및 충돌 체크
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                // 점수 획득 체크
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    score++;
                    scoreBoard.innerText = score;
                    pipes[i].passed = true;
                }

                // 충돌 체크 (박스 충돌)
                if (
                    bird.x + bird.radius > pipes[i].x &&
                    bird.x - bird.radius < pipes[i].x + pipeWidth &&
                    (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom)
                ) {
                    triggerGameOver();
                }

                // 화면 밖으로 나간 장애물 제거
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 배경 하늘 장식(구름 효과)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(100, 100, 30, 0, Math.PI * 2);
        ctx.arc(125, 90, 40, 0, Math.PI * 2);
        ctx.arc(300, 200, 25, 0, Math.PI * 2);
        ctx.fill();

        // 장애물(민트색 파이프) 그리기
        pipes.forEach(pipe => {
            ctx.fillStyle = '#48D1CC';
            // 위쪽 파이프
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
            // 아래쪽 파이프
            ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            
            // 파이프 테두리 테두리 효과
            ctx.strokeStyle = '#20B2AA';
            ctx.lineWidth = 3;
            ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);
            ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
        });

        // 노란 새 그리기
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#DAA520';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 새 눈
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(bird.x + 5, bird.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();

        // 새 부리
        ctx.fillStyle = '#FF6347';
        ctx.beginPath();
        ctx.moveTo(bird.x + bird.radius - 2, bird.y);
        ctx.lineTo(bird.x + bird.radius + 8, bird.y + 3);
        ctx.lineTo(bird.x + bird.radius - 2, bird.y + 6);
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
